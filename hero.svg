<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B12"/>
    <stop offset="0.55" stop-color="#0A111B"/>
    <stop offset="1" stop-color="#061018"/>
  </linearGradient>
  <linearGradient id="cyan" x1="700" y1="80" x2="1120" y2="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00D9FF"/>
    <stop offset="0.5" stop-color="#55B7FF"/>
    <stop offset="1" stop-color="#8D6CFF"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#8CA0B6" stroke-opacity=".09"/>
  </pattern>
</defs>

<rect width="1200" height="430" rx="18" fill="url(#bg)"/>
<rect width="1200" height="430" rx="18" fill="url(#grid)"/>

<text x="50" y="74" fill="#7D8A9A" font-family="monospace" font-size="14" letter-spacing="3">SYSTEM / NETWORK / INFRASTRUCTURE</text>
<text x="50" y="126" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="700">IT SUPPORT SPECIALIST</text>
<text x="50" y="160" fill="#8BDFFF" font-family="monospace" font-size="16">WINDOWS • NETWORKING • SERVERS • CCTV</text>
<text x="50" y="206" fill="#8C99AA" font-family="Arial, sans-serif" font-size="16">Keeping systems connected, available and working.</text>

<!-- rack -->
<g transform="translate(690 70)">
  <rect x="0" y="0" width="150" height="260" rx="12" fill="#101722" stroke="#314050"/>
  <text x="22" y="26" fill="#8191A4" font-family="monospace" font-size="10">SERVER RACK</text>
  <g>
    <rect x="18" y="42" width="114" height="42" rx="6" fill="#151F2B" stroke="#334354"/>
    <rect x="18" y="94" width="114" height="42" rx="6" fill="#151F2B" stroke="#334354"/>
    <rect x="18" y="146" width="114" height="42" rx="6" fill="#151F2B" stroke="#334354"/>
    <rect x="18" y="198" width="114" height="42" rx="6" fill="#151F2B" stroke="#334354"/>
  </g>
  <g fill="#38E8A2" filter="url(#glow)">
    <circle cx="30" cy="55" r="3"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="107" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="159" r="3"><animate attributeName="opacity" values="1;.25;1" dur=".9s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="211" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#445468" stroke-width="3">
    <path d="M46 55H112"/><path d="M46 107H112"/><path d="M46 159H112"/><path d="M46 211H112"/>
  </g>
</g>

<!-- switch -->
<g transform="translate(560 315)">
  <rect width="280" height="48" rx="9" fill="#111B26" stroke="#3A4A5A"/>
  <text x="18" y="29" fill="#7E8D9E" font-family="monospace" font-size="11">CORE SWITCH</text>
  <g fill="#20D8FF" filter="url(#glow)">
    <circle cx="150" cy="24" r="3"/><circle cx="164" cy="24" r="3"/><circle cx="178" cy="24" r="3"/>
    <circle cx="192" cy="24" r="3"/><circle cx="206" cy="24" r="3"/><circle cx="220" cy="24" r="3"/>
  </g>
</g>

<!-- monitor -->
<g transform="translate(875 85)">
  <rect width="245" height="150" rx="13" fill="#0D151F" stroke="url(#cyan)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="16" cy="15" r="4" fill="#FF5E57"/>
  <circle cx="30" cy="15" r="4" fill="#FFBD2E"/>
  <circle cx="44" cy="15" r="4" fill="#28C840"/>
  <text x="20" y="44" fill="#29E6FF" font-family="monospace" font-size="12">systeminfo</text>
  <text x="20" y="68" fill="#8898A9" font-family="monospace" font-size="10">OS: Windows Server</text>
  <text x="20" y="87" fill="#8898A9" font-family="monospace" font-size="10">DOMAIN: CONNECTED</text>
  <text x="20" y="106" fill="#39E8A2" font-family="monospace" font-size="10">PING GATEWAY ... OK</text>
  <rect x="20" y="121" width="54" height="6" rx="3" fill="#19CFFF">
    <animate attributeName="width" values="25;54;35;54" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="83" y="121" width="54" height="6" rx="3" fill="#19CFFF" opacity=".65"/>
  <rect x="146" y="121" width="54" height="6" rx="3" fill="#19CFFF" opacity=".45"/>
</g>

<!-- network paths -->
<g fill="none" stroke="url(#cyan)" stroke-width="2" stroke-dasharray="8 10" opacity=".9">
  <path d="M840 92 C860 72 875 75 900 95"/>
  <path d="M840 330 C900 290 930 250 980 235"/>
  <path d="M560 339 C470 300 430 220 500 175"/>
</g>

<!-- animated packets -->
<g fill="#26DFFF" filter="url(#glow)">
  <circle r="4">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M840 92 C860 72 875 75 900 95"/>
  </circle>
  <circle r="4">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M840 330 C900 290 930 250 980 235"/>
  </circle>
  <circle r="4">
    <animateMotion dur="2.1s" repeatCount="indefinite" path="M560 339 C470 300 430 220 500 175"/>
  </circle>
</g>

<text x="50" y="365" fill="#5D7184" font-family="monospace" font-size="11">STATUS</text>
<text x="105" y="365" fill="#39E8A2" font-family="monospace" font-size="11">● ONLINE</text>
<text x="215" y="365" fill="#5D7184" font-family="monospace" font-size="11">NETWORK</text>
<text x="300" y="365" fill="#39E8A2" font-family="monospace" font-size="11">● STABLE</text>

<text x="50" y="397" fill="#394A5B" font-family="monospace" font-size="10">MD RABBY MIA / IT INFRASTRUCTURE</text>
</svg>
